# Event fixtures for testing

draft_event:
  title: Draft Concert
  starts_at: <%= 1.week.from_now %>
  description: A draft event waiting for approval
  published: false
  user: viewer

published_event:
  title: Published Workshop
  starts_at: <%= 2.weeks.from_now %>
  description: A published event visible to all
  published: true
  user: editor

ticketed_event:
  title: Ticketed Gig
  starts_at: <%= 2.weeks.from_now %>
  published: true
  ticketing_enabled: true
  ticket_price_cents: 1000
  capacity: 50
  user: editor
